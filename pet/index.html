<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>大肥魚</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <div id="bubble" class="hidden"></div>
    <img id="share" class="hidden" alt="">

    <div id="pet" class="idle" title="點我說話 · 拖我走 · 右鍵選單">
      <img id="sprite" alt="" hidden>
      <svg id="placeholder" viewBox="0 0 200 220" aria-hidden="true">
        <ellipse cx="98" cy="126" rx="62" ry="52" fill="#4c8fd6"/>
        <ellipse cx="98" cy="136" rx="52" ry="40" fill="#7ab4ea"/>
        <g id="tail">
          <path d="M158 118c16-10 28-8 30 2-10 4-18 10-22 20-6-6-9-14-8-22Z" fill="#4c8fd6"/>
          <path d="M158 134c14 6 24 14 22 22-10-4-20-6-28-4 2-6 4-12 6-18Z" fill="#3f7fc4"/>
        </g>
        <ellipse cx="58" cy="150" rx="16" ry="10" fill="#3f7fc4" transform="rotate(-20 58 150)"/>
        <circle cx="80" cy="112" r="9" fill="#0b2230"/>
        <circle cx="83" cy="109" r="3" fill="#eaf6ff"/>
        <ellipse cx="64" cy="132" rx="9" ry="5" fill="#f2a0b8" opacity=".55"/>
        <path d="M120 96c4-14 12-20 22-18-2 8-6 14-12 18Z" fill="#8fc4f2"/>
        <circle cx="98" cy="66" r="4" fill="#cfe6fb" opacity=".9"/>
        <circle cx="86" cy="56" r="3" fill="#cfe6fb" opacity=".7"/>
        <circle cx="110" cy="52" r="2.5" fill="#cfe6fb" opacity=".6"/>
      </svg>
    </div>

    <form id="chat" class="hidden" autocomplete="off">
      <input id="input" placeholder="跟魚說話…" maxlength="200">
    </form>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
